<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Full connectivity recordings</title>
  <style>
    * { box-sizing: border-box; }
    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      place-items: center;
      color: #17202a;
      background: #f2f4f7;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
                   "Segoe UI", sans-serif;
    }
    main {
      width: min(430px, calc(100% - 32px));
      padding: 30px;
      border: 1px solid #d4dae0;
      border-radius: 14px;
      background: white;
      box-shadow: 0 12px 35px rgba(26, 36, 46, 0.12);
      text-align: center;
    }
    h1 { margin: 0 0 9px; font-size: 24px; }
    p { margin: 0 0 20px; color: #68737e; }
    select {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #aeb7c0;
      border-radius: 8px;
      background: white;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <h1>Full connectivity recordings</h1>
    <p>Select a subject to open the interactive full plot.</p>
    <select id="subjectSelect" aria-label="Select a subject">
      <option value="" selected disabled>Select subject…</option>
      <option value="S05.html">S05</option>
<option value="S06.html">S06</option>
<option value="S07.html">S07</option>
<option value="S08.html">S08</option>
<option value="S09.html">S09</option>
<option value="S10.html">S10</option>
<option value="S11.html">S11</option>
<option value="S15.html">S15</option>
<option value="S16.html">S16</option>
<option value="S17.html">S17</option>
<option value="S18.html">S18</option>
<option value="S19.html">S19</option>
<option value="S21.html">S21</option>
<option value="S24.html">S24</option>
<option value="S27.html">S27</option>
<option value="S29.html">S29</option>
<option value="S30.html">S30</option>
<option value="S31.html">S31</option>
<option value="S33.html">S33</option>
<option value="S34.html">S34</option>
<option value="S35.html">S35</option>
<option value="S37.html">S37</option>
<option value="S39.html">S39</option>
<option value="S40.html">S40</option>
<option value="S41.html">S41</option>
    </select>
  </main>
  <script>
    document.getElementById("subjectSelect").addEventListener("change", (event) => {
      if (event.target.value) window.location.href = event.target.value;
    });
  </script>
</body>
</html>
